                                <div class="device-controls">
                        `;

                        if (hasBinary) {
                            for (const cmd of srcCfg.binary) {
                                const deviceJson = JSON.stringify(device).replace(/"/g, '&quot;');
                                const cmdJson = JSON.stringify(cmd).replace(/"/g, '&quot;');
                                html += `
                                    <button class="control-btn" onclick='sendCommand(${deviceJson}, ${cmdJson})' ${!isOnline ? 'disabled' : ''}>
                                        ${escapeHtml(cmd.display_name)}
                                    </button>
                                `;
                            }
                        }

                        if (hasNumeric) {
                            for (const cmd of srcCfg.numeric) {
                                const deviceJson = JSON.stringify(device).replace(/"/g, '&quot;');
                                const cmdJson = JSON.stringify(cmd).replace(/"/g, '&quot;');
                                const cmdForAttr = JSON.stringify(cmd).replace(/'/g, "&#39;");
                                const inputId = `input_${device.id}_${Date.now()}_${Math.random()}`
                                    .replace(/[^a-zA-Z0-9_]/g, '_');

                                const curVal = getValueFromCurrent(device.current_values, cmd);

                                if (cmd.dataType === 'boolT') {
                                    const isOn = curVal !== null && curVal !== undefined && !!Number(curVal);
                                    html += `
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <label class="toggle-switch">
                                                <input type="checkbox"
                                                       class="bool-input"
                                                       data-bool-command='${cmdForAttr}'
                                                       onchange='onToggleChange(this, ${deviceJson}, ${cmdJson})'
                                                       ${isOn ? 'checked' : ''}
                                                       ${!isOnline ? 'disabled' : ''}>
                                                <span class="toggle-slider"></span>
                                            </label>
                                            <span style="font-size: 13px;">${escapeHtml(cmd.display_name)}</span>
                                        </div>
                                    `;
                                } else if (cmd.dataType === 'spinT') {
                                    const spinOptions = parseSpinValues(cmd.values);
                                    let optionsHtml = '';
                                    spinOptions.forEach(opt => {
                                        const sel = (curVal !== null && curVal !== undefined && String(curVal) === opt.key) ? 'selected' : '';
                                        optionsHtml += `
                                            <option value="${escapeHtml(opt.key)}" ${sel}>${escapeHtml(opt.description)}</option>
                                        `;
                                    });
                                    const spinName = (cmd.system_name || cmd.sending_name || '');
                                    html += `
                                        <div class="spin-select-group">
                                            <span style="font-size: 13px;">${escapeHtml(cmd.display_name)}:</span>
                                            <select class="spin-select"
                                                    data-spin-name="${escapeHtml(spinName)}"
                                                    data-spin-command='${cmdForAttr}'
                                                    onchange='sendSpinValue(${deviceJson}, ${cmdJson}, this)'
                                                    ${!isOnline ? 'disabled' : ''}>
                                                ${optionsHtml}
                                            </select>
                                        </div>
                                    `;
                                } else if (cmd.dataType === 'sliceT') {
                                    const min = Number(cmd.limitMin ?? 0);
                                    const max = Number(cmd.limitMax ?? 100);

                                    let initial = min;
                                    if (curVal !== null && curVal !== undefined) {
                                        const n = Number(curVal);
                                        if (isFinite(n)) initial = Math.max(min, Math.min(max, n));
                                    }

                                    const stateKey = `${device.id}_${cmd.sending_name || cmd.system_name || inputId}`;

                                    html += `
                                        <div class="slice-input-group"
                                             data-slice-device-id="${device.id}"
                                             data-slice-state-key="${escapeHtml(stateKey)}"
                                             data-slice-command='${cmdForAttr}'>
                                            <span class="slice-label">${escapeHtml(cmd.display_name)}</span>
                                            <input type="range"
                                                   min="${min}" max="${max}" step="1"
                                                   value="${initial}"
                                                   ${!isOnline ? 'disabled' : ''}>
                                            <input type="number"
                                                   min="${min}" max="${max}" step="1"
                                                   value="${initial}"
                                                   ${!isOnline ? 'disabled' : ''}>
                                        </div>
                                    `;
                                } else if (cmd.dataType === 'hexT') {
                                    let initialHex = '56DB96';
                                    if (Array.isArray(cmd.complex_data)) {
                                        for (const item of cmd.complex_data) {
                                            if (item && item.color && item.color.defaultValue) {
                                                initialHex = String(item.color.defaultValue).replace(/^#/, '').toUpperCase();
                                                break;
                                            }
                                        }
                                    }
                                    initialHex = normalizeHexInput(initialHex);

                                    if (curVal !== null && curVal !== undefined) {
                                        const h = toHexString(curVal);
                                        if (h) initialHex = h;
                                    }

                                    const hexId = `hex_${device.id}_${cmd.sending_name || inputId}`.replace(/[^a-zA-Z0-9_]/g, '_');

                                    html += `
                                        <div class="hex-inline-group" data-hex-id="${hexId}">
                                            <button type="button"
                                                    class="hex-swatch-btn"
                                                    data-hex-id="${hexId}"
                                                    style="background:#${initialHex};"
                                                    title="Открыть палитру"
                                                    ${!isOnline ? 'disabled' : ''}></button>
                                            <span class="hex-label">${escapeHtml(cmd.display_name)}</span>
                                            <input type="text"
                                                   class="hex-code-input"
                                                   data-hex-id="${hexId}"
                                                   data-hex-device-id="${device.id}"
                                                   data-hex-command='${cmdForAttr}'
                                                   value="${initialHex}"
                                                   maxlength="7"
                                                   spellcheck="false"
                                                   autocomplete="off"
                                                   ${!isOnline ? 'disabled' : ''}>
                                        </div>
                                    `;
                                } else if (cmd.dataType === 'strT') {
                                    const strVal = (curVal !== null && curVal !== undefined) ? String(curVal) : '';
                                    html += `
                                        <div class="str-input-group">
                                            <input type="text"
                                                   id="${inputId}"
                                                   class="str-input"
                                                   data-str-name="${escapeHtml(cmd.system_name || cmd.sending_name || '')}"
                                                   placeholder="${escapeHtml(cmd.display_name)}"
                                                   value="${escapeHtml(strVal)}"
                                                   onkeydown='handleStringEnter(event, ${deviceJson}, ${cmdJson}, this)'
                                                   ${!isOnline ? 'disabled' : ''}>
                                        </div>
                                    `;
                                } else {
                                    const numVal = (curVal !== null && curVal !== undefined) ? String(curVal) : '';
                                    html += `
                                        <div class="numeric-input-group">
                                            <input type="number"
                                                   id="${inputId}"
                                                   placeholder="${escapeHtml(cmd.display_name)}"
                                                   step="any"
                                                   value="${escapeHtml(numVal)}"
                                                   onkeydown='handleNumericEnter(event, ${deviceJson}, ${cmdJson}, this)'
                                                   ${!isOnline ? 'disabled' : ''}>
                                        </div>
                                    `;
                                }
                            }
                        }

                        html += `</div></div>`;
                    }

                    html += `</div>`;
                }
                html += `</div></div>`;
            }

            container.innerHTML = html;

            initSliceControls(container);
            initHexPickers(container);
        }

        // ============ ИНИЦИАЛИЗАЦИЯ ============

        window.sendCommand = sendCommand;
        window.sendNumericValue = sendNumericValue;
        window.sendSpinValue = sendSpinValue;
        window.sendStringValue = sendStringValue;
        window.onToggleChange = onToggleChange;
        window.handleNumericEnter = handleNumericEnter;
        window.handleStringEnter = handleStringEnter;
        window.forceRefresh = forceRefresh;

        setInterval(() => {
            const statusDot = document.getElementById('statusDot');
            if (statusDot && statusDot.classList.contains('offline')) {
                console.log('[Dashboard] Автообновление (SSE отключен)');
                loadAllData();
            }
        }, 30000);
    </script>
</body>
</html>
